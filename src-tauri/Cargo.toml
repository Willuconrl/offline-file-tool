[package]
name = "file-toolbox"
version = "1.0.0"
description = "离线文件工具箱：批量重命名、图片压缩/格式转换（含 HEIC）、PDF 合并/拆分、水印，纯本地处理"
authors = ["WillYin"]
edition = "2021"

[lib]
name = "file_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
webp = "0.3"
libheif-rs = { version = "2.7", features = ["embedded-libheif"] }
lopdf = "0.44"
ab_glyph = "0.2"

[features]
# 生产构建（或未配置 dev server 时）必须启用 custom-protocol，资源才会内嵌进可执行文件
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
